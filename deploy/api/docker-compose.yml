services:
  api:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro      # kernels, hazards/pcp, dem/LDSM+LPSR (see README.md)
      - maskcache:/cache         # masks downloaded from R2 on demand
    expose: ["8000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]
volumes:
  maskcache:
  caddydata:
