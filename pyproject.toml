[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonpark"
version = "0.1.0"
description = "Landing-site light and Earth-link planner for the lunar south pole"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "rasterio",
    "fastapi",
    "uvicorn[standard]",
    "pyarrow",
]

[project.optional-dependencies]
# spiceypy also listed under sky for callers that only need ephemeris.
dev = ["pytest", "httpx", "spiceypy"]
sky = ["spiceypy"]

[tool.setuptools.packages.find]
include = ["moonpark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
